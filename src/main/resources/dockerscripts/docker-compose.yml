version: '3.8'

services:
  postgres:
    container_name: "reactive-postgres"
    image: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: myjira

volumes:
  pgadmin_data: